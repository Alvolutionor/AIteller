collection:
  interval_hours: 3
  lookback_hours: 6
  max_items_per_source: 100

keywords:
  primary:
    - LLM
    - GPT
    - Claude
    - AI agent
    - prompt engineering
    - RAG
    - fine-tuning
    - embedding
    - vector database
    - AI coding
    - copilot
    - cursor
    - aider
    - claude code
  boost:
    - tutorial
    - workflow
    - experience
    - production
    - real-world
    - benchmark
    - comparison
    - 实战
    - 经验
    - 教程

sources:
  hackernews:
    enabled: true
    min_points: 50
  reddit:
    enabled: true
    client_id: "${REDDIT_CLIENT_ID}"
    client_secret: "${REDDIT_CLIENT_SECRET}"
    subreddits:
      - LocalLLaMA
      - MachineLearning
      - ClaudeAI
      - ChatGPT
    min_score: 20
    # ── Rate limiting (slow-but-unbanned; tuned to avoid HTTP 429) ──
    inter_sub_min: 8.0          # min seconds between subreddits
    inter_sub_max: 15.0         # max seconds between subreddits
    inter_sort_min: 3.0         # min seconds between sort orders within a sub
    inter_sort_max: 7.0         # max seconds between sort orders within a sub
    long_pause_every: 5         # take a long break every N subreddits (0=off)
    long_pause_min: 30.0
    long_pause_max: 60.0
    rss_max_retries: 5          # retry budget per RSS fetch (honors Retry-After)
    circuit_breaker_after: 3    # stop run after N consecutive sub failures
    # Per-subreddit resume checkpoint. Default: <db_dir>/reddit_progress.json.
    # A killed run resumes here, skipping subs already done (no re-fired
    # requests); the file auto-expires when a new weekly window opens.
    # Set to "" to disable checkpointing.
    # progress_file: "./data/reddit_progress.json"
  github_trending:
    enabled: true
    languages: ["python", "typescript", "rust"]
  arxiv:
    enabled: true
    categories: ["cs.CL", "cs.AI", "cs.LG"]
  youtube:
    enabled: true
  bilibili:
    enabled: true
  twitter:
    enabled: true
    nitter_instances:
      - "https://nitter.privacydev.net"
      - "https://nitter.poast.org"
    rsshub_instance: "https://rsshub.app"
  rss_blogs:
    enabled: true

llm:
  primary: "claude"
  fallback: "openai"
  claude:
    api_key: "${CLAUDE_API_KEY}"
    fast_model: "claude-haiku-4-5-20251001"
    standard_model: "claude-sonnet-4-6"
  openai:
    api_key: "${OPENAI_API_KEY}"
    fast_model: "gpt-4o-mini"
    standard_model: "gpt-4o"
  daily_token_budget: 500000

notification:
  schedule: "08:00"
  channels:
    slack:
      enabled: true
      webhook_url: "${SLACK_WEBHOOK_URL}"
    wechat:
      enabled: true
      webhook_url: "${WECHAT_WEBHOOK_URL}"
    email:
      enabled: true
      smtp_host: "smtp.qq.com"
      smtp_port: 465
      sender: "${EMAIL_SENDER}"
      password: "${EMAIL_PASSWORD}"
      recipients: []

report:
  output_dir: "./data/reports"

audio:
  enabled: true
  voices:
    zh: "zh-CN-YunxiNeural"
    en: "en-US-GuyNeural"
  script:
    highlight_count: 5
    tier1_max_items: 15
  output:
    audio_dir: "./output/weekly/audio"
    video_dir: "./output/weekly/video"
  video:
    resolution: [1920, 1080]
    bg_color_start: "#1a1a2e"
    bg_color_end: "#16213e"
    accent_color: "#e94560"
  upload:
    targets:
      - bilibili
      - youtube
    tags: ["AI", "LLM", "weekly", "engineering practice"]

storage:
  db_path: "./data/aiteller.db"
  retention_days_raw: 30
  retention_days_processed: 90

logging:
  level: "INFO"
  file: "./logs/aiteller.log"
  max_size_mb: 50
  backup_count: 5
